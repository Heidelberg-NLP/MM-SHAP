# Minimal, runnable reproduction of the ORIGINAL ("before") Python 3.6 stack.
#
# Derived from environment.yml / requirements_conda.txt, but with:
#   - exact build hashes dropped (many old builds were pruned from the channels),
#   - notebook/experiment tooling removed (jupyter, wandb, xgboost, datasets, ...),
# keeping only the packages the mm-shap_* scripts and the vendored shap/ actually use.
#
# `import shap` resolves to the vendored ./shap package (cwd precedence), so conda's
# shap is intentionally omitted to stay consistent with the uv ("after") environment.
#
# Create with:
#   MAMBA_ROOT_PREFIX="$PWD/.micromamba" ./bin/micromamba env create -y -f environment.before.yml
name: shap-before
channels:
  - pytorch
  - huggingface
  - nvidia
  - anaconda
  - conda-forge
  - defaults
dependencies:
  - python=3.6.13
  # Deep learning core (CUDA 11.1 build; runs on the RTX 3090 / sm_86)
  - pytorch=1.9.1
  - torchvision=0.10.1
  - cudatoolkit=11.1
  # Numerics / data
  - numpy=1.19.2
  - pandas=1.1.5
  - scipy=1.5.2
  - scikit-learn=0.24.2
  - matplotlib=3.3.4
  - numba=0.53.1
  - llvmlite=0.36.0
  # Hugging Face stack
  - huggingface_hub=0.0.17
  - tokenizers=0.10.3
  - transformers=4.11.1
  - sacremoses
  - regex=2021.8.3
  - protobuf=3.17.2
  # Imaging / IO / utilities
  - pillow=8.3.1
  - tqdm=4.62.2
  - requests=2.26.0
  - python-wget=3.2
  - filelock=3.0.12
  - pyyaml=5.4.1
  # Used by the vendored shap/ package
  - slicer=0.0.7
  - cloudpickle=2.0.0
  - packaging=21.0
  - pip=21.2.2
  - pip:
      - opencv-python==4.5.3.56
      - timm==0.5.4
