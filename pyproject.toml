[project]
name = "mm-shap"
version = "0.1.0"
description = "MM-SHAP: A Performance-agnostic Metric for Measuring Multimodal Contributions in Vision and Language Models & Tasks"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
dependencies = [
    # Deep learning core (CUDA 12.x wheels from PyPI work on the RTX 3090s here)
    "torch>=2.2,<2.3",
    "torchvision>=0.17,<0.18",
    # Numerics / data. numpy is kept <2.0 for numba + older-API compatibility.
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<2.3",
    "scipy>=1.10,<1.14",
    "scikit-learn>=1.3,<1.5",
    "matplotlib>=3.7,<3.9",
    "numba>=0.59,<0.61",
    # Hugging Face stack
    "transformers>=4.35,<4.40",
    "huggingface-hub>=0.19,<0.25",
    "tokenizers>=0.15,<0.20",
    "sacremoses>=0.0.53",
    "regex>=2023.0",
    "protobuf>=3.20,<5",
    "timm>=0.9,<1.0",
    # Imaging / IO / utilities
    "pillow>=9.5,<11",
    "opencv-python>=4.7,<5",
    "tqdm>=4.65",
    "requests>=2.31",
    "wget>=3.2",
    "filelock>=3.12",
    "pyyaml>=6.0",
    # Used by the vendored `shap/` package
    "slicer>=0.0.7",
    "cloudpickle>=2.2",
    "packaging>=23.0",
]

# This repo is a set of scripts plus a vendored, modified `shap/` package, not a
# distributable library, so uv manages the environment without building/installing it.
[tool.uv]
package = false
